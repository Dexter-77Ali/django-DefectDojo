# company: CI for the fork's branches.
#
# Upstream's unit-tests.yml only triggers for upstream branch names (master, dev,
# bugfix, release/**, hotfix/**), so company/** branches would get no unit or
# integration tests. This file chains the same upstream reusable workflows in the
# same order; the upstream workflow files stay untouched. The images are built from
# the unchanged upstream Dockerfiles, so the LDAP tests skip here by design (they
# need the Dockerfile.company layer) and everything else, including
# unittests/company, runs against the committed dojo/settings/local_settings.py.
name: Company CI

on:
  push:
    branches:
      - "company/**"
  pull_request:
    branches:
      - "company/**"
  workflow_dispatch:

concurrency:
  group: company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    uses: ./.github/workflows/ruff.yml
    secrets: inherit

  build-docker-containers:
    needs: ruff
    uses: ./.github/workflows/build-docker-images-for-testing.yml
    secrets: inherit
    with:
      platform: linux/amd64

  test-rest-framework:
    needs: build-docker-containers
    strategy:
      fail-fast: false
      matrix:
        v3_feature_locations: [ false, true ]
    uses: ./.github/workflows/rest-framework-tests.yml
    secrets: inherit
    with:
      platform: linux/amd64
      v3_feature_locations: ${{ matrix.v3_feature_locations }}

  test-user-interface:
    needs: build-docker-containers
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  # Company UI smoke test (tests/company_flows_test.py). Upstream's integration-tests.yml has a fixed
  # file matrix and no inputs, so its load, start, initialize and run steps are copied here for one stack.
  test-company-ui:
    needs: build-docker-containers
    runs-on: ubuntu-latest
    env:
      DJANGO_VERSION: debian
      NGINX_VERSION: alpine
      # the loaded images are tagged defectdojo/... (docker.io); docker-compose.yml defaults to registry.defectdojo.com
      # since 3.4.0, which would pull upstream's images instead (upstream's test workflows set the same)
      DD_IMAGE_REGISTRY: docker.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load images from artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: built-docker-image
          pattern: built-docker-image-*
          merge-multiple: true

      - name: Load docker images
        timeout-minutes: 10
        run: |-
             docker load -i built-docker-image/nginx-alpine-linux-amd64_img
             docker load -i built-docker-image/django-debian-linux-amd64_img
             docker load -i built-docker-image/integration-tests-debian-linux-amd64_img
             docker images

      - name: Set integration-test mode
        run: ln -s docker-compose.override.integration_tests.yml docker-compose.override.yml

      - name: Pull external images
        run: |
          for attempt in 1 2 3; do
            if docker compose pull --quiet mailhog webhook.endpoint; then
              exit 0
            fi
            echo "::warning::pull attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::could not pull mailhog / webhook.endpoint after 3 attempts"
          exit 1

      - name: Start Dojo
        timeout-minutes: 10
        run: |-
             RETRY=0
             until docker compose up --no-deps -d postgres nginx celerybeat celeryworker mailhog uwsgi valkey webhook.endpoint
               do
               if [[ $RETRY -gt 2 ]]; then
                 echo "ERROR: could not start Dojo after $RETRY retries"
                 exit 1
               fi
               RETRY=$((RETRY+1))
               echo "Attempt $RETRY to start Dojo"
               sleep 15
             done

      - name: Initialize
        timeout-minutes: 10
        run: docker compose up --no-deps --exit-code-from initializer initializer

      - name: Team for the assign test
        # tests/company_flows_test.py assigns to team "qa"; teams come from the directory or this command, no page creates them
        run: |-
             docker compose exec -T uwsgi python manage.py company_teams create qa
             docker compose exec -T uwsgi python manage.py company_teams add qa admin

      - name: Company UI tests
        timeout-minutes: 15
        run: docker compose up --no-deps --exit-code-from integration-tests integration-tests
        env:
          DD_INTEGRATION_TEST_FILENAME: tests/company_flows_test.py
          INTEGRATION_TESTS_VERSION: debian

      - name: Logs
        if: always()
        run: docker compose logs --tail="2500"

      - name: Shutdown
        if: always()
        run: docker compose down

  # every company profile must apply, and every variable it sets must reach the containers
  profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply every profile
        run: for p in companies/*/; do bash docker/company/apply-profile.sh "$(basename "$p")"; done

  company-ci-complete:
    if: always()
    needs: [ ruff, profiles, build-docker-containers, test-rest-framework, test-user-interface, test-company-ui ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any job failed, was cancelled or skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            exit 1
          fi
