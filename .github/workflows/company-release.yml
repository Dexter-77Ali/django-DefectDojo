# company: publish release images for a company tag (for example 3.3.200-company.1).
#
# Pushes three images to the registry: the upstream django release image (suffix -base),
# the company layer on top of it (the tag itself) and the nginx image. The registry defaults
# to GitHub Packages of the repository owner and needs no extra secrets; another registry is
# selected with the repository variables COMPANY_REGISTRY_HOST and COMPANY_REGISTRY (path
# prefix) plus the secrets COMPANY_REGISTRY_USERNAME and COMPANY_REGISTRY_PASSWORD.
# Upstream's release workflows stay untouched and unused.
name: Company release

on:
  push:
    tags:
      - "*-company.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, e.g. 3.3.200-company.1"
        required: true
        type: string
      profile:
        description: "Company profile under companies/ to bake in (artwork); images get the suffix -<profile>"
        required: false
        type: string
        default: ""

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag and registry
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PROFILE: ${{ inputs.profile }}
          REGISTRY_VAR: ${{ vars.COMPANY_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          registry="${REGISTRY_VAR:-ghcr.io/${OWNER}}"
          profile="${INPUT_PROFILE}"
          if [ -n "$profile" ] && ! [[ "$profile" =~ ^[a-z0-9-]+$ ]]; then
            echo "profile must match ^[a-z0-9-]+$" >&2; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "registry=${registry,,}" >> "$GITHUB_OUTPUT"
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag}${profile:+-$profile}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Apply company profile artwork
        if: steps.meta.outputs.profile != ''
        run: bash docker/company/apply-profile.sh "${{ steps.meta.outputs.profile }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.COMPANY_REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ secrets.COMPANY_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.COMPANY_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Upstream django image (release target, unchanged Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.django-debian
          target: release
          push: true
          tags: ${{ steps.meta.outputs.registry }}/defectdojo-django:${{ steps.meta.outputs.image_tag }}-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Company layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.company
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.registry }}/defectdojo-django:${{ steps.meta.outputs.image_tag }}-base
          tags: ${{ steps.meta.outputs.registry }}/defectdojo-django:${{ steps.meta.outputs.image_tag }}

      - name: nginx image (static files collected at build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx-alpine
          push: true
          tags: ${{ steps.meta.outputs.registry }}/defectdojo-nginx:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
