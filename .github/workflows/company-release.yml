# company: publish release images for a company tag (for example 3.3.200-company.1).
#
# Pushes three images to the registry: the upstream django release image (suffix -base),
# the company layer on top of it (the tag itself) and the nginx image. The registry defaults
# to GitHub Packages of the repository owner and needs no extra secrets; another registry is
# selected with the repository variables COMPANY_REGISTRY_HOST and COMPANY_REGISTRY (path
# prefix) plus the secrets COMPANY_REGISTRY_USERNAME and COMPANY_REGISTRY_PASSWORD.
# Upstream's release workflows stay untouched and unused.
name: Company release

on:
  push:
    tags:
      - "*-company.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, e.g. 3.3.200-company.1"
        required: true
        type: string

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag and registry
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REGISTRY_VAR: ${{ vars.COMPANY_REGISTRY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          registry="${REGISTRY_VAR:-ghcr.io/${OWNER}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "registry=${registry,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.COMPANY_REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ secrets.COMPANY_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.COMPANY_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Upstream django image (release target, unchanged Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.django-debian
          target: release
          push: true
          tags: ${{ steps.meta.outputs.registry }}/defectdojo-django:${{ steps.meta.outputs.tag }}-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Company layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.company
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.registry }}/defectdojo-django:${{ steps.meta.outputs.tag }}-base
          tags: ${{ steps.meta.outputs.registry }}/defectdojo-django:${{ steps.meta.outputs.tag }}

      - name: nginx image (static files collected at build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx-alpine
          push: true
          tags: ${{ steps.meta.outputs.registry }}/defectdojo-nginx:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
