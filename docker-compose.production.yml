# company: production layer. No dev override here; the stack is
#   F="-f docker-compose.yml -f docker-compose.company.yml -f docker-compose.production.yml"
#   docker compose $F pull      # images published by .github/workflows/company-release.yml
#   docker compose $F up -d
# Runbook: docker/company/README.md. Secrets are files under ./secrets/ (gitignored), copied from
# docker/company/secrets.example/. They reach the containers as DD_*_FILE, expanded by
# docker/secret-file-loader.sh before Django starts. Nothing secret lives in this file.
#
# Required environment (shell or a gitignored .env): DD_SITE_URL, DD_ALLOWED_HOSTS and
# DJANGO_VERSION/NGINX_VERSION (a tag published by company-release.yml). Images come from
# GitHub Packages of the fork owner unless DD_COMPANY_IMAGE_DJANGO / DD_COMPANY_IMAGE_NGINX
# point at another registry path.

x-django-prod: &django-prod
  image: "${DD_COMPANY_IMAGE_DJANGO:-ghcr.io/dexter-77ali/defectdojo-django}:${DJANGO_VERSION:-latest}"
  restart: unless-stopped
  environment: &django-prod-env
    DD_DEBUG: "False"
    DD_SITE_URL: "${DD_SITE_URL:?set DD_SITE_URL, e.g. https://dojo.example.com}"
    DD_ALLOWED_HOSTS: "${DD_ALLOWED_HOSTS:?set DD_ALLOWED_HOSTS, e.g. dojo.example.com}"
    DD_CSRF_TRUSTED_ORIGINS: "${DD_CSRF_TRUSTED_ORIGINS:-${DD_SITE_URL}}"
    DD_SESSION_COOKIE_SECURE: "True"
    DD_CSRF_COOKIE_SECURE: "True"
    DD_SECRET_KEY_FILE: /run/secrets/dd_secret_key
    DD_CREDENTIAL_AES_256_KEY_FILE: /run/secrets/dd_credential_aes_256_key
    DD_DATABASE_URL_FILE: /run/secrets/dd_database_url
    DD_COMPANY_LDAP_BIND_PASSWORD_FILE: /run/secrets/dd_company_ldap_bind_password
    DD_COMPANY_LDAP_CA_CERT_PATH: /run/secrets/dd_company_ldap_ca_cert   # a path, not _FILE: libldap reads the file itself
    DD_EMAIL_URL_FILE: /run/secrets/dd_email_url   # smtp+tls://user:password@relay:587, see secrets.example
    DD_FOOTER_VERSION: "${DD_FOOTER_VERSION:-${DJANGO_VERSION:-latest}}"
    DD_OS_MESSAGE_ENABLED: "False"
  secrets:
    - dd_secret_key
    - dd_credential_aes_256_key
    - dd_database_url
    - dd_company_ldap_bind_password
    - dd_company_ldap_ca_cert
    - dd_email_url

services:
  uwsgi:
    <<: *django-prod
  celerybeat:
    <<: *django-prod
  celeryworker:
    <<: *django-prod
    environment:
      <<: *django-prod-env
      DD_CELERY_WORKER_POOL_TYPE: prefork
      DD_CELERY_WORKER_AUTOSCALE_MIN: "${DD_CELERY_WORKER_AUTOSCALE_MIN:-2}"
      DD_CELERY_WORKER_AUTOSCALE_MAX: "${DD_CELERY_WORKER_AUTOSCALE_MAX:-8}"
  initializer:
    <<: *django-prod
    restart: "no"

  nginx:
    image: "${DD_COMPANY_IMAGE_NGINX:-ghcr.io/dexter-77ali/defectdojo-nginx}:${NGINX_VERSION:-latest}"
    restart: unless-stopped
    environment:
      USE_TLS: "true"
      GENERATE_TLS_CERTIFICATE: "false"
    ports: !override
      - target: 8443
        published: "${DD_TLS_PORT:-443}"
        protocol: tcp
        mode: host
    volumes:
      - ./secrets/tls/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./secrets/tls/nginx.key:/etc/nginx/ssl/nginx.key:ro

  postgres:
    restart: unless-stopped
    environment:
      # the upstream file sets POSTGRES_PASSWORD; the image refuses both, so blank it and use the file
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  valkey:
    restart: unless-stopped

  # Scheduled backups: a pg_dump (custom format) plus a tar of the uploaded files every
  # DD_COMPANY_BACKUP_INTERVAL seconds (daily) into DD_COMPANY_BACKUP_DIR (a host path, or the
  # defectdojo_backups volume by default), pruned after DD_COMPANY_BACKUP_KEEP_DAYS. Same postgres
  # image as the database so pg_dump matches the server. Copy the directory off the host.
  backup:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGHOST: "${DD_DATABASE_HOST:-postgres}"
      PGPORT: "${DD_DATABASE_PORT:-5432}"
      PGUSER: "${DD_DATABASE_USER:-defectdojo}"
      PGDATABASE: "${DD_DATABASE_NAME:-defectdojo}"
      DD_COMPANY_BACKUP_INTERVAL: "${DD_COMPANY_BACKUP_INTERVAL:-86400}"
      DD_COMPANY_BACKUP_KEEP_DAYS: "${DD_COMPANY_BACKUP_KEEP_DAYS:-14}"
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        while true; do
          stamp="$$(date +%F-%H%M)"
          # a failed dump (database still starting, connection lost) retries after a minute, not a day
          pg_dump -Fc -f "/backups/defectdojo-$$stamp.dump" || { rm -f "/backups/defectdojo-$$stamp.dump"; sleep 60; continue; }
          echo "database backup defectdojo-$$stamp.dump"
          tar czf "/backups/media-$$stamp.tgz" -C /media . && echo "media backup media-$$stamp.tgz"
          find /backups -name 'defectdojo-*.dump' -mtime "+$$DD_COMPANY_BACKUP_KEEP_DAYS" -delete
          find /backups -name 'media-*.tgz' -mtime "+$$DD_COMPANY_BACKUP_KEEP_DAYS" -delete
          sleep "$$DD_COMPANY_BACKUP_INTERVAL"
        done
    volumes:
      - "${DD_COMPANY_BACKUP_DIR:-defectdojo_backups}:/backups"
      - defectdojo_media:/media:ro
    secrets:
      - postgres_password

volumes:
  defectdojo_backups: {}

secrets:
  dd_secret_key:
    file: ./secrets/dd_secret_key
  dd_credential_aes_256_key:
    file: ./secrets/dd_credential_aes_256_key
  dd_database_url:
    file: ./secrets/dd_database_url
  dd_company_ldap_bind_password:
    file: ./secrets/dd_company_ldap_bind_password
  dd_company_ldap_ca_cert:
    file: ./secrets/dd_company_ldap_ca_cert
  dd_email_url:
    file: ./secrets/dd_email_url
  postgres_password:
    file: ./secrets/postgres_password
