# company: company layer over docker-compose.yml (and the dev override in dev mode).
#
# Select it together with the upstream files, in this order (explicit -f flags work on every
# platform; COMPOSE_FILE needs ':' as separator on Linux/macOS and ';' on Windows):
#   F="-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.company.yml"
#   docker compose -f docker-compose.yml -f docker-compose.override.yml build uwsgi   # upstream image (unchanged Dockerfile)
#   docker compose $F build uwsgi                                                      # + Dockerfile.company layer
#   docker compose $F --profile ldap up -d                                             # ldap profile = local test directory
#
# Every DD_COMPANY_* value has a workstation default; production sets them from the
# environment or DD_*_FILE secrets. Nothing secret belongs in this file.

x-company-django: &company-django
  image: "defectdojo/defectdojo-django:${DJANGO_VERSION:-latest}-company"
  build: !override
    context: .
    dockerfile: Dockerfile.company
    args:
      BASE_IMAGE: "defectdojo/defectdojo-django:${DJANGO_VERSION:-latest}"

x-company-env: &company-env
  DD_COMPANY_NAME: "${DD_COMPANY_NAME:-Company}"
  # upstream's "Upgrade to Pro" banner fetches text from Google Cloud Storage; off for company builds
  DD_OS_MESSAGE_ENABLED: "${DD_OS_MESSAGE_ENABLED:-False}"
  # local time for UI dates and the daily SLA job (07:30), e.g. Asia/Baghdad
  DD_TIME_ZONE: "${DD_TIME_ZONE:-UTC}"
  # JSON values (empty = code defaults): palette shades, product field definitions, SLA multipliers
  DD_COMPANY_PALETTE: "${DD_COMPANY_PALETTE:-}"
  DD_COMPANY_FIELDS: "${DD_COMPANY_FIELDS:-}"
  DD_COMPANY_SLA_FACTORS: "${DD_COMPANY_SLA_FACTORS:-}"
  DD_COMPANY_ESCALATION_EMAILS: "${DD_COMPANY_ESCALATION_EMAILS:-}"
  DD_COMPANY_ESCALATION_EVENTS: "${DD_COMPANY_ESCALATION_EVENTS:-sla_breach,sla_breach_combined,risk_acceptance_expiration,company_risk_requested}"
  # engagement shared by UI uploads and CI re-imports (engagement_name in the CI recipe, docker/company/README.md)
  DD_COMPANY_UPLOAD_ENGAGEMENT_NAME: "${DD_COMPANY_UPLOAD_ENGAGEMENT_NAME:-Security scans}"
  # scanner allowlist for `manage.py company_scan_types` (comma separated scan types; empty = every scanner)
  DD_COMPANY_SCAN_TYPES: "${DD_COMPANY_SCAN_TYPES:-}"
  # risk acceptance: durations a request can ask for (days), and whether only approvers (the security team) accept risk
  DD_COMPANY_RA_DAYS: "${DD_COMPANY_RA_DAYS:-30,90,180}"
  DD_COMPANY_RA_APPROVAL_REQUIRED: "${DD_COMPANY_RA_APPROVAL_REQUIRED:-False}"
  DD_COMPANY_LDAP_ENABLED: "${DD_COMPANY_LDAP_ENABLED:-False}"
  # ad = Active Directory (sAMAccountName, memberOf); openldap = RFC groups (uid, groupOfNames)
  DD_COMPANY_LDAP_PROFILE: "${DD_COMPANY_LDAP_PROFILE:-ad}"
  DD_COMPANY_LDAP_SERVER_URI: "${DD_COMPANY_LDAP_SERVER_URI:-ldap://ldap:389}"
  DD_COMPANY_LDAP_START_TLS: "${DD_COMPANY_LDAP_START_TLS:-False}"
  # PEM of the CA behind the directory certificate (LDAPS or StartTLS); empty = system CA store
  DD_COMPANY_LDAP_CA_CERT_PATH: "${DD_COMPANY_LDAP_CA_CERT_PATH:-}"
  DD_COMPANY_LDAP_BIND_DN: "${DD_COMPANY_LDAP_BIND_DN:-cn=admin,dc=company,dc=test}"
  DD_COMPANY_LDAP_BIND_PASSWORD: "${DD_COMPANY_LDAP_BIND_PASSWORD:-}"
  DD_COMPANY_LDAP_USER_BASE: "${DD_COMPANY_LDAP_USER_BASE:-ou=users,dc=company,dc=test}"
  DD_COMPANY_LDAP_GROUP_BASE: "${DD_COMPANY_LDAP_GROUP_BASE:-ou=groups,dc=company,dc=test}"
  DD_COMPANY_LDAP_ADMIN_GROUP: "${DD_COMPANY_LDAP_ADMIN_GROUP:-cn=dojo-admins,ou=groups,dc=company,dc=test}"
  DD_COMPANY_LDAP_PRODUCT_TYPE_GROUP_PREFIX: "${DD_COMPANY_LDAP_PRODUCT_TYPE_GROUP_PREFIX:-dojo-pt-}"
  # groups named <prefix><team> put their members in the team (findings are assigned to teams)
  DD_COMPANY_LDAP_TEAM_GROUP_PREFIX: "${DD_COMPANY_LDAP_TEAM_GROUP_PREFIX:-dojo-team-}"
  # group DN of the security team: its members approve risk acceptance requests (Django group risk-approvers)
  DD_COMPANY_LDAP_RISK_APPROVER_GROUP: "${DD_COMPANY_LDAP_RISK_APPROVER_GROUP:-cn=dojo-security,ou=groups,dc=company,dc=test}"

services:
  uwsgi:
    <<: *company-django
    environment: *company-env
  celerybeat:
    <<: *company-django
    environment: *company-env
  celeryworker:
    <<: *company-django
    environment: *company-env
  initializer:
    <<: *company-django
    environment: *company-env

  # Local test directory, only with `--profile ldap`. Seeded from docker/company/ldap/*.ldif
  # (users alice/bob/carol/dave/sam, groups dojo-admins, dojo-security, dojo-pt-<product type> and dojo-team-<team>). Not for production.
  ldap:
    image: osixia/openldap:1.5.0
    profiles:
      - ldap
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "Company"
      LDAP_DOMAIN: "company.test"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
    volumes:
      - ./docker/company/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
