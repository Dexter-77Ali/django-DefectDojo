# company: Helm values for the unchanged upstream chart in helm/defectdojo.
#
#   helm dependency update ./helm/defectdojo
#   helm install dojo ./helm/defectdojo -f helm/values-company.yaml --set siteUrl=https://dojo.example.com --set host=dojo.example.com
#
# Validated 2026-09-23 with helm 3.19: `helm lint` clean and `helm template` renders 20 objects with the
# company images and DD_COMPANY_* values. Not yet installed on a cluster (none exists). It mirrors the
# compose production layer: company images, DD_COMPANY_* values, pre-created secrets. Validate the
# install on the first cluster and update this header.
#
# The company local_settings.py is baked into the image, so `localsettingspy` stays empty.

images:
  django:
    image:
      registry: ghcr.io
      repository: OWNER/defectdojo-django   # company image (Dockerfile.company layer)
      tag: 3.3.200-company.1
  nginx:
    image:
      registry: ghcr.io
      repository: OWNER/defectdojo-nginx
      tag: 3.3.200-company.1

imagePullSecrets: ~   # name of a docker-registry Secret when the GHCR packages are private (string, not a list)

# Pre-create the release secret (DD_SECRET_KEY, DD_CREDENTIAL_AES_256_KEY, DD_ADMIN_PASSWORD,
# METRICS_HTTP_AUTH_PASSWORD) and the database secrets; see helm/defectdojo/README.md.
createSecret: false
createPostgresqlSecret: false
createValkeySecret: false

extraConfigs:
  DD_COMPANY_NAME: "Company"
  DD_COMPANY_LDAP_ENABLED: "False"
  DD_COMPANY_LDAP_PROFILE: "ad"
  DD_COMPANY_LDAP_SERVER_URI: "ldaps://dc.example.com:636"
  DD_COMPANY_LDAP_BIND_DN: ""
  DD_COMPANY_LDAP_USER_BASE: ""
  DD_COMPANY_LDAP_GROUP_BASE: ""
  DD_COMPANY_LDAP_ADMIN_GROUP: ""
  DD_COMPANY_LDAP_PRODUCT_TYPE_GROUP_PREFIX: "dojo-pt-"
  DD_COMPANY_ESCALATION_EMAILS: ""
  DD_OS_MESSAGE_ENABLED: "False"
  DD_FOOTER_VERSION: "3.3.200-company.1"
  DD_TIME_ZONE: "UTC"   # e.g. Asia/Baghdad
  # JSON values (DD_COMPANY_PALETTE, DD_COMPANY_FIELDS, DD_COMPANY_SLA_FACTORS) go here as strings;
  # leave out DD_COMPANY_ESCALATION_EVENTS unless setting it: an empty value disables escalation.

# Secret values as environment variables: put DD_COMPANY_LDAP_BIND_PASSWORD and DD_EMAIL_URL
# (smtp+tls://user:password@relay:587) in an existing Secret and reference them here (extraEnv with
# secretKeyRef) instead of extraConfigs. LDAPS with an internal CA: mount the CA certificate from
# a ConfigMap through the django and celery extraVolumes / extraVolumeMounts and set
# DD_COMPANY_LDAP_CA_CERT_PATH in extraConfigs to the mounted file.
extraEnv: []

localsettingspy: ""
